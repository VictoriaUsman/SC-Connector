name: Deploy to staging

# On merge to main: run checks, then full deploy-all (infra + MCP + frontend)
# to the staging environment. Pull requests run checks only (no deploy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid overlapping staging deploys; let an in-flight PR check be superseded.
concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          for req in functions/*/requirements.txt; do
            echo "Installing $req"
            pip install -r "$req"
          done

      - name: Run Python tests
        run: python -m pytest tests/ -v --tb=short

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (typecheck + bundle)
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy-staging:
    name: Deploy all to staging
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Create Pulumi virtualenv for infra
        working-directory: infra
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

      - name: Write environment files
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          cat > .env.staging <<EOF
          ENVIRONMENT=staging
          GCP_PROJECT=${GCP_PROJECT}
          GCP_REGION=${GCP_REGION}
          REGION=${GCP_REGION}
          FIREBASE_PROJECT=${GCP_PROJECT}
          PULUMI_STACK=staging
          GDRIVE_ROOT_FOLDER_ID=${GDRIVE_ROOT_FOLDER_ID}
          VITE_API_URL=${VITE_API_URL}
          VITE_API_KEY=${VITE_API_KEY}
          VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
          VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
          VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
          EOF
          cp .env.staging .env.active

      - name: Deploy all to staging
        run: make env-staging && make deploy-all
