name: Deploy to dev

# On merge to main: run checks, then full deploy-all (infra + MCP + frontend)
# to the dev environment (project kalilos-connector-dev, Pulumi stack "dev")
# -- this is the only stack; the live app (kalilos-dev-api, vercel.app
# frontend) runs on it. Pull requests run checks only (no deploy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid overlapping deploys; let an in-flight PR check be superseded.
concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          for req in functions/*/requirements.txt; do
            echo "Installing $req"
            pip install -r "$req"
          done

      - name: Run Python tests
        run: python -m pytest tests/ -v --tb=short

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (typecheck + bundle)
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy-dev:
    name: Deploy all to dev
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Apply Supabase schema
        # Runs infra/supabase/schema.sql's idempotent CREATE/ALTER statements
        # against the live dev database. Previously a manual step -- see
        # scripts/apply-supabase-schema.py; a missed run here is exactly what
        # let the jobs.mode/retry_of/row_count migration sit uncommitted and
        # unapplied while api_call-mode job inserts failed outright.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pip install psycopg2-binary
          python scripts/apply-supabase-schema.py

      - name: Create Pulumi virtualenv for infra
        working-directory: infra
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

      - name: Write environment files
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cat > .env.dev <<EOF
          ENVIRONMENT=dev
          GCP_PROJECT=${GCP_PROJECT}
          GCP_REGION=${GCP_REGION}
          REGION=${GCP_REGION}
          PULUMI_STACK=dev
          GDRIVE_ROOT_FOLDER_ID=${GDRIVE_ROOT_FOLDER_ID}
          VITE_API_URL=${VITE_API_URL}
          VITE_API_KEY=${VITE_API_KEY}
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          EOF
          cp .env.dev .env.active

      - name: Deploy backend to dev
        # Frontend hosting moved to Vercel (frontend/vercel.json), which
        # deploys on push via its own GitHub integration — not this
        # workflow. `make deploy-all` still includes a Firebase Hosting
        # step left over from before that migration; skip it here.
        run: make env-dev && make deploy-infra && make deploy-mcp
