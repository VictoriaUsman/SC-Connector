main:
  params: [args]
  steps:
    - execute_pipeline:
        try:
          call: report_pipeline
          args:
            args: ${args}
          result: pipeline_result
        except:
          as: e
          steps:
            - log_global_error:
                call: sys.log
                args:
                  json:
                    component: "report-flow"
                    phase: "workflow_error"
                    message: "Workflow failed"
                    job_id: ${args.job_id}
                    error: ${text.decode(json.encode(e))}
                  severity: ERROR
            - mark_job_failed:
                switch:
                  - condition: ${map.get(e, "code") == 403 or map.get(e, "code") == 401}
                    next: raise_final
                  - condition: true
                    steps:
                      - build_user_message:
                          # Surface a clean, human-readable message (the Cloud
                          # Function's {"error": ...} body when present) instead
                          # of dumping the whole HTTP error object — status code,
                          # headers and all — into the user-facing job error.
                          call: clean_error
                          args:
                            e: ${e}
                          result: user_message
                      - patch_job_failed:
                          call: http.patch
                          args:
                            url: '${"https://firestore.googleapis.com/v1/projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + "/databases/(default)/documents/jobs/" + args.job_id + "?updateMask.fieldPaths=status&updateMask.fieldPaths=completed_at&updateMask.fieldPaths=error_details"}'
                            auth:
                              type: OAuth2
                            body:
                              fields:
                                status:
                                  stringValue: "failed"
                                completed_at:
                                  timestampValue: ${time.format(sys.now())}
                                error_details:
                                  mapValue:
                                    fields:
                                      message:
                                        stringValue: ${user_message}
                                      phase:
                                        stringValue: "workflow_error"
                      - continue_to_raise:
                          next: raise_final
            - raise_final:
                raise: ${e}
    - return_result:
        return: ${pipeline_result}

report_pipeline:
  params: [args]
  steps:
    - validate_input:
        switch:
          - condition: ${map.get(args, "api_source") != "sp_api" and map.get(args, "api_source") != "ads_api"}
            raise:
              message: "api_source must be sp_api or ads_api"

    - route_mode:
        switch:
          - condition: ${default(map.get(args, "mode"), "report") == "api_call"}
            next: api_call_fetch

    - log_start:
        call: sys.log
        args:
          json:
            component: "report-flow"
            phase: "start"
            message: "Report flow started"
            job_id: ${map.get(args, "job_id")}
            client_id: ${args.client_id}
            api_source: ${args.api_source}
            report_type: ${args.report_type}
            marketplace: ${args.marketplace}
          severity: INFO

    - authenticate:
        try:
          call: http.post
          args:
            url: __AUTH_FUNCTION_URL__
            auth:
              type: OIDC
            body:
              api_source: ${args.api_source}
              client_id: ${args.client_id}
          result: auth_response
        retry:
          predicate: ${http.default_retry_predicate}
          max_retries: 2
          backoff:
            initial_delay: 2
            max_delay: 30
            multiplier: 2

    - create_report:
        call: throttle_retry_call
        args:
          url: __CREATE_REPORT_FUNCTION_URL__
          body:
            api_source: ${args.api_source}
            client_id: ${args.client_id}
            marketplace: ${args.marketplace}
            report_type: ${args.report_type}
            report_params: ${map.get(args, "report_params")}
            job_id: ${map.get(args, "job_id")}
            schedule_id: ${map.get(args, "schedule_id")}
            frequency: ${default(map.get(args, "frequency"), "on_demand")}
          max_throttle_retries: 8
          initial_wait_seconds: 60
        result: create_response

    - init_poll:
        assign:
          - poll_count: 0
          - max_polls: 60
          - backoff_seconds: 30

    - wait_before_poll:
        call: sys.sleep
        args:
          seconds: ${backoff_seconds}

    - poll_status:
        try:
          call: http.post
          args:
            url: __POLL_STATUS_FUNCTION_URL__
            auth:
              type: OIDC
            body:
              api_source: ${args.api_source}
              client_id: ${args.client_id}
              marketplace: ${args.marketplace}
              report_id: ${create_response.body.report_id}
              job_id: ${create_response.body.job_id}
              report_type: ${args.report_type}
          result: poll_response
        retry:
          predicate: ${non_throttle_retry}
          max_retries: 2
          backoff:
            initial_delay: 2
            max_delay: 30
            multiplier: 2
        except:
          as: poll_error
          steps:
            - check_poll_throttle:
                switch:
                  - condition: ${poll_error.code == 429 and poll_count < max_polls}
                    next: increment_poll
                  - condition: true
                    raise: ${poll_error}

    - log_poll:
        call: sys.log
        args:
          json:
            component: "report-flow"
            phase: "poll_status"
            message: "Poll status"
            job_id: ${create_response.body.job_id}
            client_id: ${args.client_id}
            report_type: ${args.report_type}
            marketplace: ${args.marketplace}
            poll_count: ${poll_count}
            report_status: ${poll_response.body.report_status}
            raw_status: ${poll_response.body.raw_status}
          severity: INFO

    - check_status:
        switch:
          - condition: ${poll_response.body.report_status == "ready"}
            next: download_upload
          - condition: ${poll_response.body.report_status == "failed"}
            next: report_failed
          - condition: ${poll_count >= max_polls}
            next: poll_timeout

    - increment_poll:
        assign:
          - poll_count: ${poll_count + 1}
          - backoff_seconds: ${if(backoff_seconds * 2 > 120, 120, backoff_seconds * 2)}
        next: wait_before_poll

    - download_upload:
        call: throttle_retry_call
        args:
          url: __DOWNLOAD_UPLOAD_FUNCTION_URL__
          body:
            api_source: ${args.api_source}
            client_id: ${args.client_id}
            marketplace: ${args.marketplace}
            report_type: ${args.report_type}
            report_id: ${create_response.body.report_id}
            job_id: ${create_response.body.job_id}
            download_info: ${poll_response.body.download_info}
            frequency: ${default(map.get(args, "frequency"), "on_demand")}
            report_params: ${map.get(args, "report_params")}
            folder_name: ${default(map.get(args, "folder_name"), "")}
            subfolder_strategy: ${default(map.get(args, "subfolder_strategy"), "date")}
            execution_date: ${default(map.get(args, "execution_date"), "")}
          max_throttle_retries: 5
          initial_wait_seconds: 60
        result: download_response

    - ingest_bigquery:
        try:
          call: http.post
          args:
            url: __INGEST_BIGQUERY_FUNCTION_URL__
            auth:
              type: OIDC
            body:
              api_source: ${args.api_source}
              client_id: ${args.client_id}
              marketplace: ${args.marketplace}
              report_type: ${args.report_type}
              report_date: ${default(map.get(args, "report_date"), "")}
              job_id: ${create_response.body.job_id}
              gdrive_file_id: ${download_response.body.drive_file_id}
          result: ingest_response
        except:
          as: ingest_error
          steps:
            - log_ingest_error:
                call: sys.log
                args:
                  json:
                    component: "report-flow"
                    phase: "ingest_bigquery"
                    error_type: "ingest_error"
                    message: "BQ ingestion failed (report delivered to Drive, not loaded to BigQuery)"
                    job_id: ${create_response.body.job_id}
                    client_id: ${args.client_id}
                    report_type: ${args.report_type}
                    marketplace: ${args.marketplace}
                    error: ${text.decode(json.encode(ingest_error))}
                  severity: ERROR
            - mark_ingest_failed:
                # The job is already "completed" (delivered to Drive); record the
                # ingestion failure on a dedicated sub-status field so it is
                # queryable without breaking the completed/failed state machine.
                call: http.patch
                args:
                  url: '${"https://firestore.googleapis.com/v1/projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + "/databases/(default)/documents/jobs/" + create_response.body.job_id + "?updateMask.fieldPaths=ingest_status&updateMask.fieldPaths=ingest_error"}'
                  auth:
                    type: OAuth2
                  body:
                    fields:
                      ingest_status:
                        stringValue: "failed"
                      ingest_error:
                        stringValue: ${text.decode(json.encode(ingest_error))}

    - log_complete:
        call: sys.log
        args:
          json:
            component: "report-flow"
            phase: "complete"
            message: "Report flow complete"
            job_id: ${create_response.body.job_id}
            client_id: ${args.client_id}
            report_type: ${args.report_type}
            marketplace: ${args.marketplace}
            drive_file_id: ${download_response.body.drive_file_id}
          severity: INFO

    - return_result:
        return:
          status: "completed"
          job_id: ${create_response.body.job_id}
          report_id: ${create_response.body.report_id}
          drive_file_id: ${download_response.body.drive_file_id}
          drive_path: ${download_response.body.drive_path}

    - report_failed:
        steps:
          - log_report_failed:
              call: sys.log
              args:
                json:
                  component: "report-flow"
                  phase: "report_failed"
                  message: "Report failed"
                  job_id: ${create_response.body.job_id}
                  client_id: ${args.client_id}
                  report_type: ${args.report_type}
                  marketplace: ${args.marketplace}
                  raw_status: ${poll_response.body.raw_status}
                severity: ERROR
          - raise_failure:
              raise: '${if(poll_response.body.raw_status == "FATAL" or poll_response.body.raw_status == "CANCELLED", "No data available — Amazon could not generate this report. The account may lack access (e.g. Brand Registry) or there is no data for the requested date range.", "Report generation failed: " + poll_response.body.raw_status)}'

    - poll_timeout:
        steps:
          - log_poll_timeout:
              call: sys.log
              args:
                json:
                  component: "report-flow"
                  phase: "poll_timeout"
                  message: "Poll timeout"
                  job_id: ${create_response.body.job_id}
                  client_id: ${args.client_id}
                  report_type: ${args.report_type}
                  marketplace: ${args.marketplace}
                  poll_count: ${poll_count}
                severity: ERROR
          - raise_timeout:
              raise: '${"Poll timeout after " + string(poll_count) + " attempts"}'

    # --- Synchronous API-call path (mode == "api_call") -------------------
    # Reached only via the route_mode jump above. The fetch_api function does
    # auth + REST fetch + Drive upload + marks the job completed in one call;
    # BigQuery ingestion then runs as a best-effort follow-up, exactly like the
    # report path.
    - api_call_fetch:
        call: throttle_retry_call
        args:
          url: __FETCH_API_FUNCTION_URL__
          body:
            api_source: ${args.api_source}
            client_id: ${args.client_id}
            marketplace: ${args.marketplace}
            report_type: ${args.report_type}
            report_params: ${map.get(args, "report_params")}
            job_id: ${map.get(args, "job_id")}
            frequency: ${default(map.get(args, "frequency"), "on_demand")}
            folder_name: ${default(map.get(args, "folder_name"), "")}
            subfolder_strategy: ${default(map.get(args, "subfolder_strategy"), "date")}
            execution_date: ${default(map.get(args, "execution_date"), "")}
            report_date: ${default(map.get(args, "report_date"), "")}
            report_end_date: ${default(map.get(args, "report_end_date"), "")}
          max_throttle_retries: 5
          initial_wait_seconds: 30
        result: fetch_response

    - api_call_ingest:
        try:
          call: http.post
          args:
            url: __INGEST_BIGQUERY_FUNCTION_URL__
            auth:
              type: OIDC
            body:
              api_source: ${args.api_source}
              client_id: ${args.client_id}
              marketplace: ${args.marketplace}
              report_type: ${args.report_type}
              report_date: ${default(map.get(args, "report_date"), "")}
              job_id: ${map.get(args, "job_id")}
              gdrive_file_id: ${fetch_response.body.drive_file_id}
          result: api_call_ingest_response
        except:
          as: api_ingest_error
          steps:
            - log_api_ingest_error:
                call: sys.log
                args:
                  json:
                    component: "report-flow"
                    phase: "ingest_bigquery"
                    error_type: "ingest_error"
                    message: "BQ ingestion failed (data delivered to Drive, not loaded to BigQuery)"
                    job_id: ${map.get(args, "job_id")}
                    client_id: ${args.client_id}
                    report_type: ${args.report_type}
                    marketplace: ${args.marketplace}
                    error: ${text.decode(json.encode(api_ingest_error))}
                  severity: ERROR
            - mark_api_ingest_failed:
                call: http.patch
                args:
                  url: '${"https://firestore.googleapis.com/v1/projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + "/databases/(default)/documents/jobs/" + args.job_id + "?updateMask.fieldPaths=ingest_status&updateMask.fieldPaths=ingest_error"}'
                  auth:
                    type: OAuth2
                  body:
                    fields:
                      ingest_status:
                        stringValue: "failed"
                      ingest_error:
                        stringValue: ${text.decode(json.encode(api_ingest_error))}

    - log_api_call_complete:
        call: sys.log
        args:
          json:
            component: "report-flow"
            phase: "complete"
            message: "API call flow complete"
            job_id: ${map.get(args, "job_id")}
            client_id: ${args.client_id}
            report_type: ${args.report_type}
            marketplace: ${args.marketplace}
            drive_file_id: ${fetch_response.body.drive_file_id}
          severity: INFO

    - return_api_call_result:
        return:
          status: "completed"
          job_id: ${map.get(args, "job_id")}
          drive_file_id: ${fetch_response.body.drive_file_id}
          drive_path: ${fetch_response.body.drive_path}

clean_error:
  # Reduce a raised error to one human-readable line for the user-facing job
  # error_details.message. A raised error can be a plain string, an HTTP error
  # map ({code, body, headers, ...}) from a failed http.post, or a custom map.
  # Our Cloud Functions return {"error": ..., "code": ...} bodies, so prefer the
  # body's "error" field and never serialize the whole HTTP object (which would
  # leak the status code and response headers into the UI as a raw JSON blob).
  params: [e]
  steps:
    - check_string:
        switch:
          - condition: ${get_type(e) == "string"}
            return: ${e}
    - read_body:
        assign:
          - err_body: ${map.get(e, "body")}
    - prefer_body_message:
        switch:
          - condition: ${err_body != null and get_type(err_body) == "map" and map.get(err_body, "error") != null}
            return: ${map.get(err_body, "error")}
          - condition: ${err_body != null and get_type(err_body) == "map" and map.get(err_body, "message") != null}
            return: ${map.get(err_body, "message")}
          - condition: ${err_body != null and get_type(err_body) == "string" and err_body != ""}
            return: ${err_body}
    - prefer_top_message:
        switch:
          - condition: ${map.get(e, "message") != null}
            return: ${map.get(e, "message")}
    - fallback_encode:
        return: ${text.decode(json.encode(e))}

non_throttle_retry:
  params: [e]
  steps:
    - check_code:
        switch:
          - condition: ${e.code == 429}
            return: false
          - condition: ${e.code == 401}
            return: false
          - condition: ${e.code == 403}
            return: false
          - condition: ${e.code >= 500}
            return: true
    - default_no_retry:
        return: false

throttle_retry_call:
  params: [url, body, max_throttle_retries, initial_wait_seconds]
  steps:
    - init_throttle:
        assign:
          - throttle_count: 0
          - wait_secs: ${initial_wait_seconds}
    - attempt_call:
        try:
          call: http.post
          args:
            url: ${url}
            auth:
              type: OIDC
            body: ${body}
          result: call_result
        retry:
          predicate: ${non_throttle_retry}
          max_retries: 3
          backoff:
            initial_delay: 5
            max_delay: 60
            multiplier: 2
        except:
          as: call_err
          steps:
            - check_throttle:
                switch:
                  - condition: ${call_err.code == 429 and throttle_count < max_throttle_retries}
                    next: throttle_backoff
                  - condition: true
                    raise: ${call_err}
    - return_call_result:
        return: ${call_result}
    - throttle_backoff:
        steps:
          - log_throttle:
              call: sys.log
              args:
                json:
                  component: "report-flow"
                  phase: "throttle"
                  message: "Throttled, backing off"
                  url: ${url}
                  attempt: ${throttle_count + 1}
                  max_retries: ${max_throttle_retries}
                  wait_seconds: ${wait_secs}
                severity: WARNING
          - sleep_with_jitter:
              call: sys.sleep
              args:
                seconds: ${wait_secs + int(sys.now()) % 15}
          - advance_throttle:
              assign:
                - throttle_count: ${throttle_count + 1}
                - wait_secs: ${if(wait_secs * 2 > 300, 300, wait_secs * 2)}
              next: attempt_call
